# Mosquitto broker config for the Strategy A/B/C comparison harness.
#
# Defaults are fine EXCEPT for max_packet_size — mosquitto 2.x rejects
# packets > ~1MB by default, and Strategy A publishes several-MB batches
# of raw audio (500 samples × 8000 int16 audio values, JSON-serialized).
#
# For the thesis harness we set 32 MB, which is plenty for both Strategy A
# (raw audio batches, ~8 MB) and Strategy B (spectrogram batches, ~3 MB).
# A production Pi deployment would either use a broker with the same
# config or shrink payloads with a better encoding.

listener 1883 localhost
allow_anonymous true

# Raise the packet-size limit to allow multi-MB payloads.
# 32 MB = 33554432 bytes.
max_packet_size 33554432
